# .github/workflows/ci-cd.yml
name: NBGV CI/CD

# GitHub Flow model for this sample:
# - PR merges to main -> dev build/test/docker-build using Microsoft-style preview SemVer
# - vX.Y.Z-rc.N tag   -> staging build/test/docker-build when tag matches NBGV version
# - vX.Y.Z tag        -> production build/test/docker-build when tag matches NBGV version
#
# Note: the workflow observes pushes to main. To ensure these are merged PRs
# rather than direct commits, protect the main branch in repository settings.
#
# CI validates the Docker build. CD pushes and deploys the image, so production
# approval only gates release actions instead of basic validation.
on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  DOTNET_VERSION: "10.0.x"
  REGISTRY: ghcr.io

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.version.outputs.environment }}
      semver: ${{ steps.version.outputs.semver }}
      nbgv_semver: ${{ steps.version.outputs.nbgv_semver }}
      docker_tag: ${{ steps.version.outputs.docker_tag }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      informational_version: ${{ steps.version.outputs.informational_version }}
      date_stamp: ${{ steps.version.outputs.date_stamp }}
      revision: ${{ steps.version.outputs.revision }}
      commit: ${{ steps.version.outputs.commit }}
      image_name: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore ./src/versioning-samples.csproj

      - name: Restore test project dependencies
        run: dotnet restore ./tests/versioning-samples.Tests/versioning-samples.Tests.csproj

      - name: Calculate Version
        id: version
        shell: bash
        run: |
          BASE_SEMVER=$(dotnet nbgv get-version -v SemVer2)
          ASSEMBLY_VERSION=$(dotnet nbgv get-version -v AssemblyVersion)
          DATE_STAMP=$(date -u +'%y%j')
          REVISION=$(git rev-list --count HEAD)
          COMMIT=$(git rev-parse --short HEAD)

          if [[ "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            EXPECTED_REF="refs/tags/v${BASE_SEMVER}"
            if [[ "${GITHUB_REF}" != "${EXPECTED_REF}" ]]; then
              echo "Stable tag ${GITHUB_REF} does not match NBGV version ${BASE_SEMVER}."
              echo "Update version.json on main and create tag with 'dotnet nbgv tag'."
              exit 1
            fi
            ENVIRONMENT="production"
          elif [[ "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            EXPECTED_REF="refs/tags/v${BASE_SEMVER}"
            if [[ "${GITHUB_REF}" != "${EXPECTED_REF}" ]]; then
              echo "RC tag ${GITHUB_REF} does not match NBGV version ${BASE_SEMVER}."
              echo "Update version.json on main and create tag with 'dotnet nbgv tag'."
              exit 1
            fi
            ENVIRONMENT="staging"
          else
            SEMVER="${BASE_SEMVER}.${DATE_STAMP}.${REVISION}+${COMMIT}"
            ENVIRONMENT="dev"
          fi

          if [[ -z "${SEMVER:-}" ]]; then
            SEMVER="${BASE_SEMVER}"
          fi

          if [[ "${SEMVER}" == *+* ]]; then
            INFORMATIONAL_VERSION="${SEMVER}"
          else
            INFORMATIONAL_VERSION="${SEMVER}+${COMMIT}"
          fi

          DOCKER_TAG="${SEMVER/+/-}"

          echo "nbgv_semver=$BASE_SEMVER" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "docker_tag=$DOCKER_TAG" >> "$GITHUB_OUTPUT"
          echo "assembly_version=$ASSEMBLY_VERSION" >> "$GITHUB_OUTPUT"
          echo "informational_version=$INFORMATIONAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "date_stamp=$DATE_STAMP" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

          echo "📦 nbgv SemVer: $BASE_SEMVER"
          echo "📦 Effective SemVer: $SEMVER"
          echo "🎯 Environment: $ENVIRONMENT"

      - name: Show trigger summary
        run: |
          echo "Ref: ${{ github.ref }}"
          echo "Environment: ${{ steps.version.outputs.environment }}"
          echo "App version: ${{ steps.version.outputs.semver }}"

      - name: Build
        run: |
          dotnet build ./src/versioning-samples.csproj -c Release --no-restore \
            -p:Version=${{ steps.version.outputs.semver }} \
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} \
            -p:InformationalVersion=${{ steps.version.outputs.informational_version }}

      - name: Test
        run: |
          dotnet test ./tests/versioning-samples.Tests/versioning-samples.Tests.csproj -c Release --no-restore

      - name: Publish artifact files
        run: |
          dotnet publish ./src/versioning-samples.csproj -c Release -o ./publish --no-restore \
            -p:Version=${{ steps.version.outputs.semver }} \
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} \
            -p:InformationalVersion=${{ steps.version.outputs.informational_version }}

          cat > ./publish/version.json << EOF
          {
            "nbgvSemVer": "${{ steps.version.outputs.nbgv_semver }}",
            "semVer": "${{ steps.version.outputs.semver }}",
            "informationalVersion": "${{ steps.version.outputs.informational_version }}",
            "assemblyVersion": "${{ steps.version.outputs.assembly_version }}",
            "dateStamp": "${{ steps.version.outputs.date_stamp }}",
            "revision": "${{ steps.version.outputs.revision }}",
            "commit": "${{ steps.version.outputs.commit }}",
            "environment": "${{ steps.version.outputs.environment }}"
          }
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.version.outputs.semver }}
          path: ./publish

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker image build
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          push: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.docker_tag }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
          build-args: |
            VERSION=${{ steps.version.outputs.semver }}
            ASSEMBLY_VERSION=${{ steps.version.outputs.assembly_version }}
            INFORMATIONAL_VERSION=${{ steps.version.outputs.informational_version }}
            NBGV_SEMVER=${{ steps.version.outputs.nbgv_semver }}
            DATE_STAMP=${{ steps.version.outputs.date_stamp }}
            REVISION=${{ steps.version.outputs.revision }}
            COMMIT=${{ steps.version.outputs.commit }}
            DEPLOYMENT_ENVIRONMENT=${{ steps.version.outputs.environment }}

  cd:
    needs: ci
    # Deploy dev only for preview builds; staging/prod still deploy by tag.
    if: ${{ needs.ci.outputs.environment != 'dev' || contains(needs.ci.outputs.semver, '-preview.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment: ${{ needs.ci.outputs.environment }}
    outputs:
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.ci.outputs.image_name }}
          tags: |
            type=raw,value=${{ needs.ci.outputs.docker_tag }}
            type=raw,value=${{ needs.ci.outputs.environment }}
            type=raw,value=latest,enable=${{ needs.ci.outputs.environment == 'production' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          build-args: |
            VERSION=${{ needs.ci.outputs.semver }}
            ASSEMBLY_VERSION=${{ needs.ci.outputs.assembly_version }}
            INFORMATIONAL_VERSION=${{ needs.ci.outputs.informational_version }}
            NBGV_SEMVER=${{ needs.ci.outputs.nbgv_semver }}
            DATE_STAMP=${{ needs.ci.outputs.date_stamp }}
            REVISION=${{ needs.ci.outputs.revision }}
            COMMIT=${{ needs.ci.outputs.commit }}
            DEPLOYMENT_ENVIRONMENT=${{ needs.ci.outputs.environment }}

      - name: Deploy selected image
        run: |
          echo "🚀 Deploying ${{ needs.ci.outputs.image_name }}:${{ needs.ci.outputs.docker_tag }}"
          echo "🎯 Target environment: ${{ needs.ci.outputs.environment }}"

